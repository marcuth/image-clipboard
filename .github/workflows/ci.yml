name: CI

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["master"]

permissions:
    contents: write

concurrency:
    group: ci-${{ github.head_ref || github.ref_name }}
    cancel-in-progress: true

jobs:
    ci:
        name: Lint, Format and Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.head_ref || github.ref_name }}

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "npm"

            - name: Install dependencies
              run: npm install

            - name: install dependencies (ubuntu only)
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - name: Rust Cache
              uses: swatinem/rust-cache@v2
              with:
                  workspaces: "./src-tauri -> target"

            - name: Fix Frontend Lint & Format
              run: |
                  npm run lint:fix
                  npm run format

            - name: Fix Backend Format
              run: |
                  cd src-tauri
                  cargo fmt

            - name: Commit changes
              if: github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
              uses: stefanzweifel/git-auto-commit-action@v5
              with:
                  commit_message: "chore: auto format and lint fix [skip ci]"
                  branch: ${{ github.head_ref || github.ref_name }}
                  commit_user_name: github-actions[bot]
                  commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
                  commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>

            - name: Frontend Build Check
              run: npm run build

            - name: Backend Tests
              run: cd src-tauri && cargo test

            - name: Backend Lint (Clippy)
              run: cd src-tauri && cargo clippy -- -D warnings
